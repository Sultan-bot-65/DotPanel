name: Build DotPanel APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'DotPanel.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract project
        run: |
          unzip DotPanel.zip -d source
          chmod +x source/DotPanel/gradlew

      - name: Build debug APK
        run: |
          cd source/DotPanel
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DotPanel-APK
          path: source/DotPanel/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
