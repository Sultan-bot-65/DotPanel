name: Build DotPanel APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Locate project folder (unzips DotPanel.zip if needed)
        run: |
          f=$(find . -name settings.gradle.kts | head -n 1)
          if [ -z "$f" ] && [ -f DotPanel.zip ]; then
            mkdir -p "$RUNNER_TEMP/src" && unzip -q DotPanel.zip -d "$RUNNER_TEMP/src"
            f=$(find "$RUNNER_TEMP/src" -name settings.gradle.kts | head -n 1)
          fi
          if [ -z "$f" ]; then
            echo "settings.gradle.kts not found. Repo contents:"; ls -R | head -50; exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$f")" >> "$GITHUB_ENV"
          echo "Project folder: $(dirname "$f")"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # Android SDK (platform 35, build-tools, licenses) is preinstalled on GitHub's Ubuntu runners.
      # Gradle is installed here, so the build does not depend on gradlew / gradle-wrapper.jar.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: 8.9

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -o pipefail
          gradle assembleDebug --console=plain 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Show build errors in summary
        if: failure()
        run: |
          {
            echo '## Build errors'
            echo '```'
            grep -E '^e: |error:|What went wrong|Caused by|Execution failed|Unresolved|Could not' "$RUNNER_TEMP/build.log" | head -n 60
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: build-log
          path: ${{ runner.temp }}/build.log

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: DotPanel-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Run unit tests
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle testDebugUnitTest --stacktrace
